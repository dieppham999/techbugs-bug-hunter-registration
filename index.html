<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBugs - Bug Hunter Registration</title>
</head>
<body>
    <header>
        <h2>TechBugs – Cổng đăng ký Chiến binh săn lỗi</h2>
        <hr>
    </header>

    <main>
        <h2>Đăng ký tham gia săn lỗi</h2>
        <form action="" method="GET">
            <fieldset>
                <legend style="font-weight: bold;">Thông tin cá nhân</legend>
                <label for="fullname">Họ và tên:</label>
                <input type="text" name="fullname" id="fullname" placeholder="Nhập tên" required> <br><br>

                <label for="email">Email liên hệ:</label>
                <input type="email" name="email" id="email" placeholder="Nhập email" required> <br><br>

                <label for="password">Mật khẩu hệ thống:</label>
                <input type="password" name="password" id="password" minlength="8" required> <br><br>
            </fieldset>
            <fieldset>
                <legend>Trình độ của bạn:</legend>
                <input type="radio" name="level" id="newbie" value="Newbie" required>
                <label for="newbie">Mới tập chơi</label>
                
                <input type="radio" name="level" id="intermediate" value="Intermediate">
                <label for="intermediate">Trung cấp</label>
                
                <input type="radio" name="level" id="pro" value="Pro">
                <label for="pro">Chuyên nghiệp</label>
                <br><br>
            </fieldset>
            <fieldset>
                <legend>Kinh nghiệm nền tảng:</legend>
            
                <input type="checkbox" name="platform" id="web" value="Web">
                <label for="web">Web</label>
            
                <input type="checkbox" name="platform" id="mobile" value="Mobile">
                <label for="mobile">Mobile App</label>
                <br><br>
            </fieldset>
            <fieldset>
                <legend>Lý do tham gia:</legend>
                <label for="reason">Nhập lý do:</label><br>
                <textarea name="reason" id="reason"></textarea>
                <br><br>
            </fieldset>
            <input type="submit" value="Đăng ký ngay">
        </form>

        
    </main>

    <footer>

    </footer>
</body>
</html>
