<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h2>TechBugs – Cổng đăng ký Chiến binh săn lỗi</h2>
        <hr>
    </header>

    <main>

        <form action="https://bold-tiger-59.webhook.cool" method="GET">
            <fieldset>
                <legend style="font-weight: bold;">Đăng ký tham gia săn lỗi</legend>
                <label for="fullname">Họ và tên:</label>
                <input type="text" name="fullname" id="fullname" placeholder="Nhập tên" required> <br><br>

                <label for="email">Email liên hệ:</label>
                <input type="email" name="email" id="email" placeholder="Nhập email" required> <br><br>

                <label for="password">Mật khẩu hệ thống:</label>
                <input type="password" name="password" id="password" minlength="8" required> <br><br>

                <label for="level">Trình độ của bạn:</label>
                <input type="radio" name="level" id="level" value="Newbie"> Mới tập chơi
                <input type="radio" name="level" id="level" value="Pro"> Chuyên nghiệp
                <br><br>

                <label for="platform">Kinh nghiệm nền tảng:</label>
                <input type="checkbox" name="platform" id="platform" value="Web"> Web
                <input type="checkbox" name="platform" id="platform" value="Mobile"> Mobile App
                <br><br>

                <label for="reason">Lý do tham gia:</label><br>
                <textarea name="reason" id="reason"></textarea>
                <br><br>
            </fieldset>
            <input type="submit" value="Đăng ký ngay">
        </form>

        
    </main>

    <footer>

    </footer>
</body>
</html>
